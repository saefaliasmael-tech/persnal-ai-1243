directories:
  output: release
  buildResources: build
appId: com.personalai.desktop
productName: Personal AI
copyright: Copyright © 2026 Personal AI
asar: true
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Personal AI
  uninstallDisplayName: Personal AI
  runAfterFinish: true
portable:
  artifactName: ${productName} Portable.${ext}
electronVersion: 44.4.5
